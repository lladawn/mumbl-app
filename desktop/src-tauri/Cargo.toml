[package]
name = "mumbl-desktop-helper"
version = "0.1.0"
description = "mumbl office-sim desktop menubar helper — shape-only active-app relay"
authors = ["mumbl"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mumbl_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the character window must be TRANSPARENT (it sits in the
# menubar strip, which has no fixed background). Note this rules out Mac App
# Store distribution; mumbl ships direct, so the trade is fine.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# apple-native enables the macOS Keychain backend; without a backend feature
# keyring v3 has no keystore and set_password() fails (Save silently breaks).
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
  "NSString",
  "NSNotification",
  "NSDictionary",
  "NSOperation",
  "NSThread",
  "NSRunLoop",
  "NSObject",
  "NSDate",
  "block2",
] }
objc2-app-kit = { version = "0.2", features = [
  "NSWorkspace",
  "NSRunningApplication",
  # libc: gates NSRunningApplication::processIdentifier, which is how we detect
  # "the frontmost app is US" (see platform::macos::is_self).
  "libc",
  # NSScreen: read the notch geometry at boot so "I can't see the tray icon"
  # is answerable from the log instead of by guesswork.
  "NSScreen",
  # NSWindow: raise the popover above every other app, including fullscreen
  # ones — see platform::macos::float_above_everything.
  "NSWindow",
  "NSResponder",
  "NSApplication",
] }
block2 = "0.5"
# Already in the tree via tauri/wry — used to read the ONE fact AppKit will not
# tell us directly: whether the menubar is currently on screen.
core-graphics = "0.25"
core-foundation = "0.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
